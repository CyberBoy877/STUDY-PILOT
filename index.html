<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyPilot - Class 10 Study Manager</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>📚 StudyPilot</h1>
        <p>Your Personal Class 10 Study Manager</p>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <button onclick="showSection('dashboard')">Dashboard</button>
        <button onclick="showSection('tasks')">Tasks</button>
        <button onclick="showSection('notes')">Notes</button>
        <button onclick="showSection('videos')">Videos</button>
        <button onclick="showSection('timer')">Timer</button>
    </nav>

    <!-- MAIN CONTENT -->
    <main>

        <!-- DASHBOARD -->
        <section id="dashboard" class="section active">

            <div class="card">
                <h2>🎯 Daily Goal</h2>
                <input type="text" id="goalInput" placeholder="Enter your goal">
                <button onclick="saveGoal()">Save Goal</button>
                <p id="goalDisplay">No goal set</p>
            </div>

            <div class="card">
                <h2>📅 Exam Countdown</h2>
                <input type="date" id="examDate">
                <button onclick="saveExamDate()">Save Date</button>
                <p id="countdown"></p>
            </div>

            <div class="card">
                <h2>🔥 Study Streak</h2>
                <p id="streak">0 Days</p>
            </div>

        </section>

        <!-- TASKS -->
        <section id="tasks" class="section">

            <div class="card">
                <h2>📝 Tasks</h2>
                <input type="text" id="taskInput" placeholder="Add a task">
                <button onclick="addTask()">Add Task</button>

                <ul id="taskList"></ul>
            </div>

        </section>

        <!-- NOTES -->
        <section id="notes" class="section">

            <div class="card">
                <h2>📒 Notes</h2>
                <textarea id="notesArea" rows="10" placeholder="Write your notes..."></textarea>
                <button onclick="saveNotes()">Save Notes</button>
            </div>

        </section>

        <!-- VIDEOS -->
        <section id="videos" class="section">

            <div class="card">
                <h2>🎥 Daily One-Shot Video</h2>

                <h3 id="videoTitle">Loading...</h3>

                <button onclick="loadVideo()">Refresh Video</button>
                <br><br>

                <a id="videoLink" target="_blank">
                    ▶ Watch Video
                </a>
            </div>

        </section>

        <!-- TIMER -->
        <section id="timer" class="section">

            <div class="card">
                <h2>⏳ Pomodoro Timer</h2>

                <div id="timerDisplay">25:00</div>

                <button onclick="startTimer()">Start</button>
                <button onclick="resetTimer()">Reset</button>
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>Made by CyberBoy877 🚀</p>
    </footer>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
